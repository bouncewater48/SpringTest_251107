<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>날짜 포맷과 String함수</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>

    <div class="container">
        <h2>회원 정보 리스트</h2>

        <table class="table text-center">

            <thead>
                <tr>
                    <th>No</th>
                    <th>이름</th>
                    <th>생년월일</th>
                    <th>전화번호</th>
                    <th>국적</th>
                    <th>이메일</th>
                    <th>자기소개</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="member, status:${members}">
                    <td th:text="${status.count}"></td>
                    <td th:text="${member.name}"></td>
<!--                    <td th:text="${member.birth}"></td>-->
                    <td th:text="${#temporals.format(member.birth, 'yyy년 M월 d일')}"></td>
                    <td>
<!--                    <td th:text="${member.phoneNumber}">-->
                        <span th:if="${#strings.startsWith(member.phoneNumber, '010')}" th:text="${member.phoneNumber}"></span>
                        <span th:unless="${#strings.startsWith(member.phoneNumber, '010')}">유효하지 않은 전화번호</span>
                    </td>
                    <td th:text="${#strings.replace(member.nationality, '삼국시대', '삼국 - ')}"></td>
                    <td>
                        <b th:text="${#strings.arraySplit(member.email, '@')[0]}"></b>@<span th:text="${#strings.arraySplit(member.email, '@')[1]}"></span>
                    </td>
                    <td class="text-left">
<!--                    <td th:text="${member.introduce}">-->
                        <span th:if="${#strings.length(member.introduce) <= 15}" th:text="${member.introduce}"></span>
                        <span th:unless="${#strings.length(member.introduce) <= 15}" th:text="|${#strings.substring(member.introduce, 0, 15)}...|"></span>
                    </td>
                </tr>
            </tbody>

        </table>
    </div>

</body>
</html>
