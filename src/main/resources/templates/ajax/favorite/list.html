<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>즐겨찾기 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>

    <div>
        <h2>즐겨찾기 목록</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>이름</th>
                    <th>주소</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="favorite:${favoriteList}">
                    <td th:text="${favorite.id}">12</td>
                    <td th:text="${favorite.name}">유튜브</td>
                    <td th:text="${favorite.url}">https://youtube.com</td>
                    <td>
                        <button th:value="${favorite.id}" type="button" class="btn btn-danger btn-sm remove-btn">삭제</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
