<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>통나무 펜션 예약 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>

    <div id="wrap">

        <header class="d-flex align-items-center justify-content-center">
            <div class="display-4">통나무 팬션</div>
        </header>

            <nav class="main-menu bg-success d-flex nav-fill">
                <div class="nav-item"><a class="nav-link text-white" href="#">팬션소개</a></div>
                <div class="nav-item"><a class="nav-link text-white" href="#">객실보기</a></div>
                <div class="nav-item"><a class="nav-link text-white" href="#">예약안내</a></div>
                <div class="nav-item"><a class="nav-link text-white" href="#">예약목록</a></div>
            </nav>

        <section class="contents">
            <h2 class="text-center">예약 목록 보기</h2>
            <table class="table">

                <thead>
                    <tr class="text-center">
                        <th>이름</th>
                        <th>예약날짜</th>
                        <th>숙박일수</th>
                        <th>숙박인원</th>
                        <th>전화번호</th>
                        <th>예약상태</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="booking:${bookingList}" class="text-center">
                        <td th:text="${booking.name}">강승훈</td>
                        <td th:text="${#temporals.format(booking.date, 'yyyy년 M월 d일')}">2021년 6월 30일</td>
                        <td th:text="${booking.day}">2</td>
                        <td th:text="${booking.headcount}">4</td>
                        <td th:text="${booking.phoneNumber}">010-1232-1111</td>
                        <td th:switch="${booking.state}">
                            <span th:case="대기중" class="text-info">대기중</span>
                            <span th:case="확정" class="text-success">확정</span>
                            <span th:case="확정" class="text-danger">취소</span>
                            <span th:case="*" th:text="${booking.state}"></span>
                        </td>
                        <td>
                            <button type="button" th:data-booking-id="${booking.id}" class="btn btn-danger btn-sm remove-btn">삭제</button>
                        </td>
                    </tr>
                </tbody>

            </table>


        </section>

        <footer>
            <div class="small text-secondary">
                <div>제주특별자치도 제주시 애월읍</div>
                <div>사업자등록번호: 111-22-255222 / 농어촌민박사업자지정 / 대표:김퉁옥</div>
                <div>Copyright 2025 tongnamu All right reserved</div>
            </div>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        $(".remove-btn").on("click", function () {

            let id = $(this).data("booking-id"); // data:{"id":id} 행 id(PK)를 여기서 저장(지정)하고 사용해야함!

            $.ajax({
                type:"get"
                , url:"/ajax/booking/remove"
                , data:{"id":id} // 오류 발생, 이유를 모르겠음
                , success:function(response) {
                    // 성공 : {"result":"success"}
                    // 실패 : {"result":"fail"}
                    if(response.result === "success") {
                        location.reload();
                    } else {
                        alert("삭제 실패!!");
                    }
                }
                , error:function() {
                    alert("삭제 에러!");
                }
            })

        })
    </script>

</body>
</html>
