<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>통나무 팬션 예약하기 화면</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    <div>
        <header class="d-flex align-items-center justify-content-center">
            <div class="display-4">통나무 팬션</div>
        </header>

        <nav class="main-menu bg-success d-flex nav-fill">
            <div class="nav-item"><a class="nav-link text-white" href="#">팬션소개</a></div>
            <div class="nav-item"><a class="nav-link text-white" href="#">객실보기</a></div>
            <div class="nav-item"><a class="nav-link text-white" href="#">예약안내</a></div>
            <div class="nav-item"><a class="nav-link text-white" href="#">예약목록</a></div>
        </nav>

        <section class="contents d-flex justify-content-center">
            <div class="col-6 my-4">
                <h2 class="text-center">예약 하기</h2>
                <div>
                    <label>이름</label>
                    <input type="text" class="form-control" id="nameInput">
                    <label>예약날짜</label>
                    <input type="text" class="form-control" id="dayInput">
                    <label>숙박일수</label>
                    <input type="text" class="form-control" id="dateInput">
                    <label>숙박인원</label>
                    <input type="text" class="form-control" id="headcountInput">
                    <label>전화번호</label>
                    <input type="text" class="form-control" id="phoneNumberInput">
                    <button class="btn btn-warning text-center mt-3" id="bookingBtn">예약하기</button>
                </div>
            </div>
        </section>

        <footer>
            <div class="small text-secondary">
                <div>제주특별자치도 제주시 애월읍</div>
                <div>사업자등록번호: 111-22-255222 / 농어촌민박사업자지정 / 대표:김퉁옥</div>
                <div>Copyright 2025 tongnamu All right reserved</div>
            </div>
        </footer>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        $("#bookingBtn").on("click", function() {
            let name = $("#nameInput").val();
            let date = $("#dateInput").val();
            let day = $("#dayInput").val();
            let headcount = $("#headcountInput").val();
            let phoneNumber = $("#phoneNumberInput").val();

            if(name === "") {
                alert("이름을 입력해주세요")
                return ;
            }

            if(date === "") {
                alert("날짜를 입력해주세요")
                return ;
            }

            if(day === "") {
                alert("숙박일수를 입력해주세요")
                return;
            }

            if(headcount === "") {
                alert("숙박인원을 입력해주세요")
                return ;
            }

            if(phoneNumber === "") {
                alert("전화번호를 입력해주세요")
                return ;
            }


        })

    </script>

</body>
</html>
